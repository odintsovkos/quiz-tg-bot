# Пример: третье руководство. Больше ничего в структуре не меняется —
# каталог по префиксу, файл на главу.
manual:
  id: integration
  title: Технологии интеграции
  short: Интеграция
chapter:
  id: ch00
  title: Глава 0. Пример главы
  source: "Технологии интеграции (главы)/000 Глава 0. Пример главы.html"

questions:
  - id: integration.ch00.001
    text: Почему групповые опросы публикуются неанонимными?
    difficulty: medium
    options:
      - text: Иначе Telegram не присылает poll_answer и балл начислить некому
        correct: true
      - text: Так требует лимит в 300 символов
      - text: Анонимные опросы нельзя публиковать по расписанию
      - text: Иначе опрос не попадёт в нужную тему чата
    explanation: Бот предупреждает участников об этом при подключении чата.
    reference: 0.1. Групповые опросы

  - id: integration.ch00.002
    text: Сколько символов допускает нативный quiz-опрос Telegram в тексте вопроса?
    difficulty: easy
    options:
      - text: "300"
        correct: true
      - text: "100"
      - text: "200"
      - text: "4096"
    explanation: Для варианта ответа предел 100 символов, для пояснения — 200.
    reference: 0.2. Ограничения формата
