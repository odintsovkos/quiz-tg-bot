# Пример: приложение того же руководства. Приложения отличаются только
# идентификатором главы: ap00 вместо ch00.
manual:
  id: dev
  title: Руководство разработчика
  short: Разработчик
chapter:
  id: ap00
  title: Приложение 0. Пример приложения
  source: "Руководство разработчика (главы)/900 Приложение 0. Пример приложения.html"

questions:
  - id: dev.ap00.001
    text: Из чего складывается название темы, которое участник видит в боте?
    difficulty: easy
    options:
      - text: Из manual.short и chapter.title через «·»
        correct: true
      - text: Из имени файла без расширения
      - text: Из manual.title и номера главы
      - text: Из поля reference первого вопроса
    explanation: Шаблон названия — «{manual.short} · {chapter.title}».
    reference: 0.1. Темы

  # Вопрос без explanation и с явно выключенной активностью: такой вопрос
  # лежит в файле, но в викторинах не участвует.
  - id: dev.ap00.002
    text: Какое поле вопроса нельзя менять после первой загрузки в банк?
    difficulty: medium
    active: false
    options:
      - text: id — по нему живёт накопленная статистика
        correct: true
      - text: text — формулировка фиксируется навсегда
      - text: difficulty — сложность задаётся один раз
      - text: reference — ссылка на раздел неизменна
    reference: 0.2. Идентификаторы
