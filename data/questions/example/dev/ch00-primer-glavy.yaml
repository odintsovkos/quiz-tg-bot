# Пример: глава руководства разработчика.
# Имя файла — идентификатор главы и слаг её названия: ch00-primer-glavy.yaml.
manual:
  id: dev
  title: Руководство разработчика
  short: Разработчик
chapter:
  id: ch00
  title: Глава 0. Пример главы
  source: "Руководство разработчика (главы)/000 Глава 0. Пример главы.html"

# Тема в боте: «Разработчик · Глава 0. Пример главы».
questions:
  - id: dev.ch00.001
    text: Сколько вариантов ответа должно быть у вопроса по правилам проекта?
    difficulty: easy
    options:
      - text: Ровно четыре, один из них верный
        correct: true
      - text: Два, верный и неверный
      - text: От пяти до десяти
      - text: Количество не ограничено
    explanation: Формат допускает от 2 до 10 вариантов, но принятое правило проекта — ровно 4.
    reference: 0.1. Формат вопроса

  - id: dev.ch00.002
    text: Что произойдёт при повторном запуске импорта тех же файлов?
    difficulty: medium
    options:
      - text: Изменившиеся вопросы обновятся, дубликаты не появятся
        correct: true
      - text: Все вопросы загрузятся заново как новые
      - text: Импорт завершится ошибкой «дубликат id»
      - text: Банк очистится и заполнится заново
    explanation: Импорт идемпотентен и опознаёт вопросы по стабильному полю id.
    reference: 0.2. Импорт

  # Значения, которые YAML разберёт как булево или пустоту, берутся в кавычки.
  - id: dev.ch00.003
    text: Какое значение вернёт соединение, если соответствующей записи нет?
    difficulty: hard
    options:
      - text: "NULL"
        correct: true
      - text: "Неопределено"
      - text: "0"
      - text: Пустая строка
    explanation: Отсутствующие поля левого соединения заполняются значением "NULL".
    reference: 0.3. Соединения
