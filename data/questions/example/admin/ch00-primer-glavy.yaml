# Пример: глава другого руководства. Каталог и manual.id — свои,
# идентификаторы вопросов начинаются с того же префикса.
manual:
  id: admin
  title: Руководство администратора
  short: Администратор
chapter:
  id: ch00
  title: Глава 0. Пример главы
  source: "Руководство администратора (главы)/000 Глава 0. Пример главы.html"

questions:
  - id: admin.ch00.001
    text: Где хранятся все данные бота?
    difficulty: easy
    options:
      - text: В одном файле SQLite по пути из переменной DB_PATH
        correct: true
      - text: В нескольких файлах рядом с исходным кодом
      - text: В памяти процесса до перезапуска
      - text: В каталоге с YAML-файлами вопросов
    explanation: База работает в режиме WAL, поэтому рядом лежат файлы -wal и -shm.
    reference: 0.1. Хранение данных

  - id: admin.ch00.002
    text: Что происходит с вопросом, исчезнувшим из YAML-файлов, при импорте?
    difficulty: medium
    options:
      - text: Он остаётся в банке — иначе потерялась бы его статистика
        correct: true
      - text: Удаляется вместе со статистикой
      - text: Деактивируется, статистика сохраняется
      - text: Импорт прерывается с ошибкой
    explanation: Импорт только добавляет и обновляет, ничего не удаляя.
    reference: 0.2. Импорт
