services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Путь внутри контейнера; на хосте это именованный том ниже.
      DB_PATH: /data/quiz.sqlite3
    volumes:
      - quiz-bot-data:/data
      # Банк вопросов монтируется отдельно, чтобы обновлять его без пересборки.
      - ./data/questions:/app/data/questions:ro

volumes:
  quiz-bot-data:
